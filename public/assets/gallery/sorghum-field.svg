<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="sorghumSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="60%" stop-color="#D4EFDF"/>
      <stop offset="100%" stop-color="#FCF3CF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#sorghumSky)"/>
  
  <!-- Horizon & Soil -->
  <path d="M0 310 Q200 290 400 305 Q600 290 800 305 L800 550 L0 550 Z" fill="#7D6608"/>
  <rect x="0" y="340" width="800" height="210" fill="#6E2C00" opacity="0.6"/>

  <!-- Sorghum Stalks Background rows -->
  <g opacity="0.6">
    <ellipse cx="100" cy="280" rx="15" ry="35" fill="#D35400"/>
    <ellipse cx="180" cy="275" rx="15" ry="38" fill="#E67E22"/>
    <ellipse cx="260" cy="280" rx="15" ry="35" fill="#CA6F1E"/>
    <ellipse cx="340" cy="270" rx="16" ry="40" fill="#D35400"/>
    <ellipse cx="420" cy="275" rx="15" ry="38" fill="#E67E22"/>
    <ellipse cx="500" cy="280" rx="15" ry="35" fill="#BA4A00"/>
    <ellipse cx="580" cy="270" rx="16" ry="40" fill="#D35400"/>
    <ellipse cx="660" cy="275" rx="15" ry="38" fill="#E67E22"/>
    <ellipse cx="740" cy="280" rx="15" ry="35" fill="#CA6F1E"/>
  </g>

  <!-- Foreground High-Yield Sorghum Heads & Plants -->
  <g transform="translate(150, 180)">
    <!-- Stalk -->
    <path d="M50 340 Q55 200 60 90" stroke="#27AE60" stroke-width="12" fill="none"/>
    <!-- Leaves -->
    <path d="M55 280 Q-20 250 -70 290 Q-10 220 56 240" fill="#2ECC71"/>
    <path d="M58 220 Q130 180 180 220 Q120 150 59 190" fill="#28B463"/>
    <!-- Dense Sorghum Grain Head -->
    <ellipse cx="60" cy="80" rx="35" ry="75" fill="#BA4A00"/>
    <!-- Grain Clusters Texture -->
    <circle cx="50" cy="40" r="7" fill="#E67E22"/><circle cx="65" cy="45" r="7" fill="#F39C12"/>
    <circle cx="45" cy="65" r="8" fill="#D35400"/><circle cx="68" cy="60" r="8" fill="#E67E22"/>
    <circle cx="55" cy="85" r="8.5" fill="#F39C12"/><circle cx="75" cy="85" r="7.5" fill="#D35400"/>
    <circle cx="45" cy="110" r="8" fill="#E67E22"/><circle cx="65" cy="110" r="8" fill="#F39C12"/>
    <circle cx="58" cy="130" r="6" fill="#D35400"/>
  </g>

  <g transform="translate(420, 150)">
    <path d="M50 370 Q52 200 55 90" stroke="#27AE60" stroke-width="14" fill="none"/>
    <path d="M52 300 Q140 260 200 310 Q140 230 54 260" fill="#2ECC71"/>
    <path d="M54 220 Q-30 180 -90 220 Q-20 150 53 190" fill="#28B463"/>
    <ellipse cx="55" cy="80" rx="38" ry="85" fill="#C0392B"/>
    <circle cx="45" cy="35" r="7" fill="#E67E22"/><circle cx="65" cy="40" r="8" fill="#F39C12"/>
    <circle cx="40" cy="65" r="8.5" fill="#D35400"/><circle cx="68" cy="65" r="8.5" fill="#E67E22"/>
    <circle cx="50" cy="95" r="9" fill="#F39C12"/><circle cx="75" cy="95" r="8" fill="#D35400"/>
    <circle cx="42" cy="125" r="8" fill="#E67E22"/><circle cx="68" cy="125" r="8" fill="#F39C12"/>
    <circle cx="55" cy="145" r="6.5" fill="#D35400"/>
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="280" height="48" rx="24" fill="#1F5733" opacity="0.95"/>
  <circle cx="54" cy="54" r="14" fill="#2E9E44"/>
  <path d="M48 54 L52 58 L60 50" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="78" y="50" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Sorghum & Forage Research</text>
  <text x="78" y="65" font-family="'Poppins', sans-serif" font-size="10" fill="#E2F0D9">High-Sugar & Drought-Hardy Hybrids</text>
</svg>