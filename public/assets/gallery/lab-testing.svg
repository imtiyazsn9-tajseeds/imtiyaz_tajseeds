<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FB"/>
      <stop offset="100%" stop-color="#D4E6F1"/>
    </linearGradient>
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7E9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#labBg)"/>

  <!-- Lab Background Wall Tiles -->
  <g stroke="#BDC3C7" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <!-- vertical lines -->
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="700" y1="0" x2="700" y2="340"/>
  </g>

  <!-- Germination Incubator Chamber (Left) -->
  <rect x="50" y="100" width="160" height="240" rx="6" fill="#FFFFFF" stroke="#95A5A6" stroke-width="3"/>
  <rect x="65" y="120" width="130" height="180" rx="4" fill="#E8F8F5" stroke="#2E9E44" stroke-width="2"/>
  <!-- Incubator Trays with Germinating Sprouted Seeds -->
  <line x1="65" y1="155" x2="195" y2="155" stroke="#BDC3C7" stroke-width="2"/>
  <line x1="65" y1="195" x2="195" y2="195" stroke="#BDC3C7" stroke-width="2"/>
  <line x1="65" y1="235" x2="195" y2="235" stroke="#BDC3C7" stroke-width="2"/>
  <line x1="65" y1="275" x2="195" y2="275" stroke="#BDC3C7" stroke-width="2"/>

  <!-- Little sprouts on trays -->
  <g fill="#27AE60">
    <circle cx="85" cy="150" r="3"/><path d="M85 150 Q88 142 92 140" stroke="#27AE60" stroke-width="2"/>
    <circle cx="115" cy="150" r="3"/><path d="M115 150 Q118 142 122 140" stroke="#27AE60" stroke-width="2"/>
    <circle cx="145" cy="150" r="3"/><path d="M145 150 Q148 142 152 140" stroke="#27AE60" stroke-width="2"/>
    <circle cx="175" cy="150" r="3"/><path d="M175 150 Q178 142 182 140" stroke="#27AE60" stroke-width="2"/>

    <circle cx="85" cy="190" r="3"/><path d="M85 190 Q88 182 92 180" stroke="#27AE60" stroke-width="2"/>
    <circle cx="115" cy="190" r="3"/><path d="M115 190 Q118 182 122 180" stroke="#27AE60" stroke-width="2"/>
    <circle cx="145" cy="190" r="3"/><path d="M145 190 Q148 182 152 180" stroke="#27AE60" stroke-width="2"/>
    <circle cx="175" cy="190" r="3"/><path d="M175 190 Q178 182 182 180" stroke="#27AE60" stroke-width="2"/>
  </g>

  <!-- Incubator Temp display -->
  <rect x="90" y="305" width="80" height="22" rx="3" fill="#1C2833"/>
  <text x="96" y="321" font-family="monospace" font-size="12" fill="#00FF66">25.0°C | 95%</text>

  <!-- Main Laboratory Benchtop -->
  <rect x="0" y="340" width="800" height="35" fill="url(#counterGrad)" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="0" y="375" width="800" height="175" fill="#2C3E50"/>
  <!-- Under-bench Drawers & Cabinets -->
  <rect x="40" y="390" width="160" height="140" rx="4" fill="#34495E"/>
  <rect x="230" y="390" width="160" height="140" rx="4" fill="#34495E"/>
  <rect x="420" y="390" width="160" height="140" rx="4" fill="#34495E"/>
  <rect x="610" y="390" width="160" height="140" rx="4" fill="#34495E"/>
  <!-- Handles -->
  <line x1="100" y1="410" x2="140" y2="410" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="410" x2="330" y2="410" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  <line x1="480" y1="410" x2="520" y2="410" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>
  <line x1="670" y1="410" x2="710" y2="410" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>

  <!-- High-Precision Digital Microscope on Bench -->
  <g transform="translate(300, 160)">
    <!-- Base -->
    <rect x="20" y="165" width="70" height="15" rx="3" fill="#1B2631"/>
    <!-- Stage -->
    <rect x="30" y="115" width="50" height="8" rx="2" fill="#2C3E50"/>
    <!-- Pillar -->
    <rect x="75" y="50" width="14" height="120" rx="4" fill="#7F8C8D"/>
    <!-- Arm & Eyepieces -->
    <path d="M75 55 L35 55 L30 30" stroke="#34495E" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="20" y="15" width="16" height="20" rx="2" fill="#17202A"/>
    <rect x="28" y="70" width="18" height="30" rx="2" fill="#BDC3C7"/> <!-- Objective lens -->
    <!-- Specimen Petri Dish -->
    <ellipse cx="55" cy="115" rx="18" ry="4" fill="#AED6F1" opacity="0.8"/>
    <circle cx="53" cy="115" r="2" fill="#F1C40F"/>
    <circle cx="57" cy="115" r="2" fill="#E67E22"/>
  </g>

  <!-- Petri Dishes with Germination Filter Papers -->
  <ellipse cx="440" cy="335" rx="30" ry="10" fill="#FFFFFF" stroke="#95A5A6" stroke-width="2"/>
  <ellipse cx="440" cy="335" rx="24" ry="7" fill="#E8F8F5"/>
  <!-- Seedlings sprouting in petri dish -->
  <circle cx="430" cy="335" r="3" fill="#27AE60"/>
  <circle cx="440" cy="334" r="3" fill="#2ECC71"/>
  <circle cx="450" cy="336" r="3" fill="#27AE60"/>

  <ellipse cx="510" cy="335" rx="30" ry="10" fill="#FFFFFF" stroke="#95A5A6" stroke-width="2"/>
  <ellipse cx="510" cy="335" rx="24" ry="7" fill="#FCF3CF"/>
  <circle cx="505" cy="335" r="2.5" fill="#D35400"/>
  <circle cx="515" cy="334" r="2.5" fill="#D35400"/>

  <!-- Moisture Analyzer Meter -->
  <rect x="580" y="270" width="110" height="70" rx="5" fill="#EAEDED" stroke="#7F8C8D" stroke-width="2"/>
  <rect x="595" y="285" width="80" height="30" rx="3" fill="#000000"/>
  <text x="605" y="306" font-family="monospace" font-size="14" font-weight="bold" fill="#00FF66">9.4% H₂O</text>
  <circle cx="605" cy="326" r="4" fill="#27AE60"/>
  <text x="615" y="329" font-family="sans-serif" font-size="8" fill="#566573">PASSED</text>

  <!-- Lab Tech Scientist -->
  <g transform="translate(190, 180)">
    <!-- Lab coat -->
    <rect x="25" y="60" width="35" height="100" rx="6" fill="#FFFFFF" stroke="#BDC3C7"/>
    <!-- Blue nitrile gloves -->
    <circle cx="20" cy="115" r="7" fill="#2E86C1"/>
    <circle cx="65" cy="115" r="7" fill="#2E86C1"/>
    <!-- Head -->
    <circle cx="42" cy="35" r="15" fill="#F5CBA7"/>
    <!-- Hair -->
    <path d="M28 32 C30 18 55 18 57 32 Z" fill="#1C2833"/>
    <!-- Safety glasses -->
    <rect x="34" y="30" width="18" height="6" rx="2" fill="#AED6F1" stroke="#34495E"/>
    <text x="30" y="80" font-family="sans-serif" font-size="6" fill="#1F5733" font-weight="bold">TAJ QC</text>
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="280" height="48" rx="24" fill="#1F5733" opacity="0.95"/>
  <circle cx="54" cy="54" r="14" fill="#2E9E44"/>
  <path d="M48 54 L52 58 L60 50" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="78" y="50" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">In-House Quality Laboratory</text>
  <text x="78" y="65" font-family="'Poppins', sans-serif" font-size="10" fill="#E2F0D9">98%+ Germination & Genetic Purity</text>
</svg>