<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2F0D9"/>
      <stop offset="60%" stop-color="#EBF5FB"/>
      <stop offset="100%" stop-color="#D4EFDF"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2F4F4"/>
      <stop offset="100%" stop-color="#E5E8E8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F5733"/>
      <stop offset="100%" stop-color="#153E24"/>
    </linearGradient>
    <linearGradient id="tarmacGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F8C8D"/>
      <stop offset="100%" stop-color="#34495E"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="550" fill="url(#skyGrad)"/>
  
  <!-- Distant Trees & Greenery -->
  <path d="M0 320 Q60 280 140 310 Q240 270 340 300 Q460 275 580 305 Q700 270 800 315 L800 370 L0 370 Z" fill="#27AE60" opacity="0.35"/>
  <path d="M0 335 Q80 305 180 325 Q300 295 420 325 Q540 300 660 320 Q740 305 800 330 L800 370 L0 370 Z" fill="#1F5733" opacity="0.5"/>

  <!-- Warehouse Building -->
  <!-- Main Shed -->
  <polygon points="120,240 400,160 680,240 680,410 120,410" fill="url(#wallGrad)" stroke="#BDC3C7" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="100,245 400,150 700,245 680,255 400,168 120,255" fill="url(#roofGrad)"/>
  
  <!-- Green Fascia Accent Stripe -->
  <rect x="120" y="245" width="560" height="18" fill="#2E9E44"/>
  <rect x="120" y="263" width="560" height="6" fill="#D7262E"/>

  <!-- Warehouse Signage -->
  <rect x="250" y="195" width="300" height="42" rx="4" fill="#FFFFFF" stroke="#2E9E44" stroke-width="2"/>
  <text x="270" y="222" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="#D7262E">TAJ</text>
  <text x="320" y="222" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="#1F4E9C">SEEDS</text>
  <text x="395" y="222" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#1F5733" letter-spacing="1.5">MEDCHAL FACILITY</text>

  <!-- Shutter Loading Bays -->
  <!-- Bay 1 -->
  <rect x="160" y="300" width="85" height="110" rx="3" fill="#34495E"/>
  <line x1="160" y1="315" x2="245" y2="315" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="160" y1="335" x2="245" y2="335" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="160" y1="355" x2="245" y2="355" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="160" y1="375" x2="245" y2="375" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="160" y1="395" x2="245" y2="395" stroke="#7F8C8D" stroke-width="2"/>
  <rect x="195" y="285" width="16" height="10" rx="2" fill="#F1C40F"/>
  <text x="200" y="293" font-family="sans-serif" font-size="8" font-weight="bold" fill="#000">01</text>

  <!-- Bay 2 (With seed transport truck) -->
  <rect x="280" y="300" width="85" height="110" rx="3" fill="#1B2631"/>
  <!-- Bay 3 -->
  <rect x="400" y="300" width="85" height="110" rx="3" fill="#34495E"/>
  <line x1="400" y1="315" x2="485" y2="315" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="400" y1="335" x2="485" y2="335" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="400" y1="355" x2="485" y2="355" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="400" y1="375" x2="485" y2="375" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="400" y1="395" x2="485" y2="395" stroke="#7F8C8D" stroke-width="2"/>
  <rect x="435" y="285" width="16" height="10" rx="2" fill="#F1C40F"/>
  <text x="440" y="293" font-family="sans-serif" font-size="8" font-weight="bold" fill="#000">02</text>

  <!-- Bay 4 -->
  <rect x="520" y="300" width="85" height="110" rx="3" fill="#34495E"/>
  <line x1="520" y1="315" x2="605" y2="315" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="520" y1="335" x2="605" y2="335" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="520" y1="355" x2="605" y2="355" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="520" y1="375" x2="605" y2="375" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="520" y1="395" x2="605" y2="395" stroke="#7F8C8D" stroke-width="2"/>
  <rect x="555" y="285" width="16" height="10" rx="2" fill="#F1C40F"/>
  <text x="560" y="293" font-family="sans-serif" font-size="8" font-weight="bold" fill="#000">03</text>

  <!-- Ground / Concrete Apron -->
  <rect x="0" y="410" width="800" height="140" fill="url(#tarmacGrad)"/>
  <!-- Safety Yellow Lines -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#F1C40F" stroke-width="4" stroke-dasharray="25 15"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="30 20" opacity="0.7"/>

  <!-- Transport Truck parked at Bay 2 -->
  <rect x="260" y="330" width="125" height="90" rx="5" fill="#2E9E44"/>
  <rect x="245" y="355" width="30" height="65" rx="4" fill="#D7262E"/>
  <rect x="248" y="360" width="18" height="22" rx="2" fill="#AED6F1"/>
  <!-- Truck Wheels -->
  <circle cx="260" cy="425" r="12" fill="#17202A"/>
  <circle cx="260" cy="425" r="5" fill="#BDC3C7"/>
  <circle cx="340" cy="425" r="12" fill="#17202A"/>
  <circle cx="340" cy="425" r="5" fill="#BDC3C7"/>
  <circle cx="368" cy="425" r="12" fill="#17202A"/>
  <circle cx="368" cy="425" r="5" fill="#BDC3C7"/>
  <!-- Truck branding -->
  <text x="275" y="380" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#FFFFFF">TAJ SEEDS</text>
  <text x="275" y="394" font-family="sans-serif" font-size="9" fill="#E8F8F5">Logistics Fleet</text>

  <!-- Forklift / Pallet Stacks on right -->
  <rect x="635" y="375" width="45" height="35" rx="2" fill="#E67E22"/>
  <rect x="640" y="350" width="35" height="25" rx="2" fill="#F39C12"/>
  <rect x="645" y="328" width="25" height="22" rx="2" fill="#F1C40F"/>
  <line x1="630" y1="410" x2="685" y2="410" stroke="#85929E" stroke-width="4"/>

  <!-- Overlay Badge -->
  <rect x="30" y="30" width="230" height="48" rx="24" fill="#1F5733" opacity="0.95"/>
  <circle cx="54" cy="54" r="14" fill="#2E9E44"/>
  <path d="M48 54 L52 58 L60 50" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="78" y="50" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Medchal Central Facility</text>
  <text x="78" y="65" font-family="'Poppins', sans-serif" font-size="10" fill="#E2F0D9">High-Capacity Seed Storage</text>
</svg>